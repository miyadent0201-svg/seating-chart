<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>席次表メーカー</title><style id="css">
/* layout idea: the room seen from above, screen wall on top, four blocks of three-seat desks in six rows; a sticky action bar below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16232e; --muted:#5b6b78; --line:#c5ced6;
  --accent:#0d6b63; --accent-ink:#ffffff; --desk:#e6d8bd; --desk-ink:#4b3d22;
  --child:#fff3c9; --danger:#b3261e;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171d; --surface:#1a242c; --ink:#e8eef2; --muted:#9fb0bc; --line:#3a4854;
    --accent:#3fb8ac; --accent-ink:#06211e; --desk:#4d4330; --desk-ink:#f1e4c6;
    --child:#4a4222; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171d; --surface:#1a242c; --ink:#e8eef2; --muted:#9fb0bc; --line:#3a4854;
  --accent:#3fb8ac; --accent-ink:#06211e; --desk:#4d4330; --desk-ink:#f1e4c6;
  --child:#4a4222; --danger:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 160px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:6px}
.head input{width:100%;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;padding:4px 2px;border-radius:4px}
.head input:focus{border-color:var(--accent);background:var(--surface);outline:none}
#title{font-size:22px;font-weight:700}
#sub{font-size:14px;color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.room{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 12px;display:flex;flex-direction:column;gap:14px}
.front{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:6px;align-items:stretch;font-size:11px;text-align:center}
.front span{display:flex;align-items:center;justify-content:center;min-height:30px;border-radius:4px;padding:2px 4px}
.wc{border:1px solid var(--line);color:var(--muted)}
.screen{background:var(--ink);color:var(--surface);font-weight:700;letter-spacing:.04em}
.stairs{border:1px solid var(--line);color:var(--muted);background:repeating-linear-gradient(90deg,transparent 0 7px,var(--line) 7px 8px)}
.stairs b{background:var(--surface);padding:0 4px;font-weight:400}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.tbl{display:flex;flex-direction:column;gap:4px;min-width:0}
.end{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.end .chair,.end .add{flex:0 1 46%}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);gap:4px;align-items:stretch}
.side{display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.desk{border:2px solid var(--desk-ink);background:var(--desk);color:var(--desk-ink);border-radius:6px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:100px}
.desk strong{font-size:20px;line-height:1.1;word-break:break-all;text-align:center}
.desk small{font-size:10px;line-height:1.2;text-align:center}
.chair{min-height:44px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 4px;font-size:13px;line-height:1.25;word-break:break-all;color:var(--muted);min-width:0}
.chair.on{border-color:var(--accent);background:var(--surface);color:var(--ink);font-weight:700}
.chair .aff{display:block;font-weight:400;font-size:10px;line-height:1.2;color:var(--muted)}
.chair.kid{background:var(--child);font-size:12px}
.chair.kid::after{content:"（子）";font-weight:400;font-size:10px;color:var(--muted)}
.add{min-height:30px;border:1.5px dashed var(--line);background:transparent;border-radius:8px;color:var(--muted);font-size:12px;padding:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.status{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btn{flex:1;min-height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;padding:6px 8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--danger)}
.btn.slim{flex:0 0 auto}
.btn:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:16px}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.sheet label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input[type=text]{border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:18px;background:var(--bg);color:var(--ink);width:100%}
.sheet label.c{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.sheet label.c input{width:22px;height:22px;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pv{background:#fff;border:1px solid var(--line);max-width:100%;height:auto;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:90%;text-align:center}
#printbox{display:none}
.pv+.pv{margin-top:8px}
.btns+.btns{margin-top:0}
.view .add{display:none}
.share-url{font-size:12px !important;word-break:break-all}
@media print{html,body{background:#fff}#app{display:none}#printbox{display:block}#printbox img{display:block;page-break-after:always;break-after:page}#printbox img:last-child{page-break-after:auto;break-after:auto}#printbox.ls img{width:297mm;height:210mm}#printbox.pt img{width:210mm;height:297mm}}
@media (min-width:600px){.chair{font-size:15px}.mid{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}.ov{align-items:center}.sheet{border-radius:14px}}

.room{padding:8px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 8px 6px}
.grid{display:flex;flex-direction:column;gap:14px;min-width:820px}
.frontbar{align-self:center;background:var(--ink);color:var(--surface);font-weight:700;font-size:12px;letter-spacing:.2em;padding:4px 60px;border-radius:4px}
.rw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.desk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--desk-ink);border-radius:6px;overflow:hidden;background:var(--desk)}
.seat{min-height:64px;border:0;border-right:1px solid var(--desk-ink);background:var(--surface);padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.2;word-break:break-all;text-align:center}
.seat:last-child{border-right:0}
.seat .code{font-size:10px;color:var(--muted)}
.seat .aff{font-size:9px;color:var(--muted)}
.seat .nm{font-size:13px;font-weight:700;color:var(--ink);margin:auto 0}
.seat .empty{font-size:12px;color:var(--muted);margin:auto 0}
.seat.mid:not(.on){background:transparent}
.seat.mid:not(.on) .code{opacity:.55}
.seat.on{box-shadow:inset 0 0 0 2px var(--accent)}
.seat.kid{background:var(--child)}
.seat:focus-visible{outline-offset:-3px}
</style></head><body><div id="app"></div><div id="printbox"></div><style id="pagestyle"></style><script>
(function(){
'use strict';
var LS_KEY='sekiji-draft-v2';
var COLS='ABCDEFGHIJKL', ROWS=6, BLOCKS=4;
var app=document.getElementById('app');
var state, viewing=false, sheet=null, toastMsg='', toastTimer=0;

function defaultState(){return {rev:0,title:'席次表',sub:'',seats:{}};}
function validCode(c){return typeof c==='string'&&/^[A-L][1-6]$/.test(c);}
function clean(o){
  if(!o||typeof o!=='object'||!o.seats||typeof o.seats!=='object')return null;
  var out={rev:+o.rev||0,title:String(o.title||''),sub:String(o.sub||''),seats:{}};
  Object.keys(o.seats).forEach(function(c){
    var x=o.seats[c];if(!validCode(c)||!x)return;
    var n=String(x.n||'').trim();if(!n)return;
    out.seats[c]={n:n,a:String(x.a||'').trim(),c:!!x.c};
  });
  return out;
}
function encodeState(st){
  var o={title:st.title,sub:st.sub,seats:st.seats};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeState(h){
  try{
    var b=h.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    var o=clean(JSON.parse(decodeURIComponent(escape(atob(b)))));
    if(o)o.rev=0;return o;
  }catch(e){return null;}
}
function loadDraft(){
  var d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY));}catch(e){}
  return clean(d);
}
function load(){
  var m=/^#s=([A-Za-z0-9_-]+)$/.exec(location.hash||'');
  var shared=m?decodeState(m[1]):null;
  if(shared){state=shared;viewing=true;return;}
  viewing=false;
  state=loadDraft()||defaultState();
}
function shareUrl(){return location.href.split('#')[0]+'#s='+encodeState(state);}
function touch(){
  if(viewing)return;
  state.rev=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function total(){return Object.keys(state.seats).length;}
function codeAt(block,pos,row){return COLS.charAt(block*3+pos)+(row+1);}

/* ---------- screen ---------- */
function seatHtml(code,mid){
  var s=state.seats[code];
  var cls='seat'+(mid?' mid':'')+(s?' on':'')+(s&&s.c?' kid':'');
  var body=s?((s.a?'<small class="aff">'+esc(s.a)+'</small>':'')+'<span class="nm">'+esc(s.n)+'</span>'):'<span class="empty">'+(mid?(viewing?'':'＋'):'空席')+'</span>';
  return '<button type="button" class="'+cls+'" data-act="seat" data-c="'+code+'" aria-label="'+code+'の席 '+(s?esc(s.n):(mid?'真ん中・未使用':'空席'))+'"><small class="code">'+code+'</small>'+body+'</button>';
}
function statusText(){return viewing?'共有された席次表（見るだけ）':'この端末に自動保存しています';}
function render(){
  var keep=document.activeElement&&document.activeElement.id;
  var sc=document.getElementById('scroll'),sl=sc?sc.scrollLeft:0;
  var ro=viewing?' readonly':'';
  var h='<div class="wrap'+(viewing?' view':'')+'"><header class="head">'+
    '<input id="title" type="text" aria-label="タイトル" placeholder="タイトル" value="'+esc(state.title)+'"'+ro+'>'+
    '<input id="sub" type="text" aria-label="日付・会の名前" placeholder="日付・会の名前（印刷に入ります）" value="'+esc(state.sub)+'"'+ro+'>'+
    '<p class="hint">'+(viewing?'送られてきた席次表です。「席次表PDF」「席札PDF」から印刷できます。':'席を押して氏名と所属病院名を入れます。机の真ん中（＋）の席も、押せば使えます。表は横に動かせます。')+'</p></header>'+
    '<div class="room"><div id="scroll" class="scroll"><div class="grid"><div class="frontbar">前方</div>';
  for(var r=0;r<ROWS;r++){
    h+='<div class="rw">';
    for(var b=0;b<BLOCKS;b++){
      h+='<div class="desk3">'+seatHtml(codeAt(b,0,r),false)+seatHtml(codeAt(b,1,r),true)+seatHtml(codeAt(b,2,r),false)+'</div>';
    }
    h+='</div>';
  }
  h+='</div></div></div></div>'+
    '<div class="bar"><div class="bar-in"><div class="status"><span id="st">'+esc(statusText())+'</span><span>合計 '+total()+' 名</span></div>'+
    '<div class="btns"><button type="button" class="btn pri" data-act="pdf">席次表PDF</button><button type="button" class="btn pri" data-act="cards">席札PDF</button></div>'+
    '<div class="btns">'+(viewing?'<button type="button" class="btn" data-act="edit">自分で編集する</button>'
      :'<button type="button" class="btn" data-act="share">リンクで共有</button><button type="button" class="btn slim warn" data-act="reset">リセット</button>')+
    '</div></div></div>';
  if(sheet)h+='<div class="ov" data-act="ov"><div class="sheet" role="dialog" aria-modal="true">'+sheetHtml()+'</div></div>';
  if(toastMsg)h+='<div class="toast" role="status">'+esc(toastMsg)+'</div>';
  app.innerHTML=h;
  sc=document.getElementById('scroll');if(sc)sc.scrollLeft=sl;
  if(sheet&&sheet.focus){var f=document.getElementById(sheet.focus);if(f){f.focus();try{f.select();}catch(e){}}sheet.focus=null;}
  else if(keep&&!sheet){var k=document.getElementById(keep);if(k)k.focus();}
}
function refreshStatus(){var el=document.getElementById('st');if(el)el.textContent=statusText();}
function toast(m){toastMsg=m;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';render();},3500);render();}

function sheetHtml(){
  var s=sheet,x;
  if(s.kind==='seat'){
    x=state.seats[s.c]||{n:'',a:'',c:false};
    return '<h2>'+s.c+' の席</h2>'+
      '<label class="f" for="seat-name">氏名<input id="seat-name" type="text" autocomplete="off" enterkeyhint="next" value="'+esc(x.n)+'"></label>'+
      '<label class="f" for="seat-aff">所属病院名（空欄でもかまいません）<input id="seat-aff" type="text" autocomplete="off" enterkeyhint="done" value="'+esc(x.a)+'"></label>'+
      '<label class="c" for="seat-kid"><input id="seat-kid" type="checkbox"'+(x.c?' checked':'')+'>お子様の席</label>'+
      '<div class="row"><button type="button" class="btn pri" data-act="seat-ok">決定</button><button type="button" class="btn" data-act="close">やめる</button></div>'+
      (state.seats[s.c]?'<div class="row"><button type="button" class="btn warn" data-act="seat-clear">空席に戻す</button></div>':'');
  }
  if(s.kind==='reset'){
    return '<h2>リセット</h2><p>入力した氏名と所属をすべて消します。消したあとは元に戻せません。</p>'+
      '<div class="row"><button type="button" class="btn warn" data-act="reset-ok">全部消す</button><button type="button" class="btn" data-act="close">やめる</button></div>';
  }
  if(s.kind==='pdf'){
    var imgs='';for(var i=0;i<s.urls.length;i++)imgs+='<img class="pv" alt="印刷プレビュー '+(i+1)+'ページ目" src="'+s.urls[i]+'">';
    return '<h2>'+(s.mode==='cards'?'席札プレビュー（A4縦・1枚に8人分・全'+s.urls.length+'ページ）':'印刷プレビュー（A4横）')+'</h2>'+
      (s.mode==='cards'?'<p>点線で切り離して使います。色はクリニックごとに自動で分かれます。</p>':'')+
      '<div class="row"><button type="button" class="btn pri" data-act="pdf-save">PDFを保存</button><button type="button" class="btn" data-act="print">このまま印刷</button></div>'+
      imgs+
      '<div class="row"><button type="button" class="btn" data-act="close">閉じる</button></div>';
  }
  if(s.kind==='share'){
    return '<h2>リンクで共有</h2><p>このリンクを送ると、相手は今の席次表を見て印刷できます。あとで内容を変えたら、もう一度リンクを送り直してください。</p>'+
      '<input id="share-url" class="share-url" type="text" readonly value="'+esc(s.url)+'">'+
      '<div class="row"><button type="button" class="btn pri" data-act="share-copy">リンクをコピー</button>'+
      (navigator.share?'<button type="button" class="btn" data-act="share-send">LINEなどで送る</button>':'')+'</div>'+
      '<div class="row"><button type="button" class="btn" data-act="close">閉じる</button></div>';
  }
  if(s.kind==='edit'){
    return '<h2>自分で編集する</h2><p>この席次表をこの端末にコピーして編集します。この端末で作りかけの席次表がある場合は、置き換わります。</p>'+
      '<div class="row"><button type="button" class="btn pri" data-act="edit-ok">コピーして編集する</button><button type="button" class="btn" data-act="close">やめる</button></div>';
  }
  return '';
}
function commitSeat(){
  var s=sheet;if(!s||s.kind!=='seat')return;
  var n=document.getElementById('seat-name'),af=document.getElementById('seat-aff'),k=document.getElementById('seat-kid');
  var name=n?n.value.replace(/\s+/g,' ').trim():'';
  if(!name){delete state.seats[s.c];}
  else state.seats[s.c]={n:name,a:af?af.value.replace(/\s+/g,' ').trim():'',c:!!(k&&k.checked)};
  touch();
}
function onAct(act,el){
  var s=sheet;
  if(viewing&&!/^(pdf|cards|pdf-save|print|close|edit|edit-ok)$/.test(act))return;
  switch(act){
    case 'seat': sheet={kind:'seat',c:el.getAttribute('data-c'),focus:'seat-name'};break;
    case 'close': sheet=null;break;
    case 'seat-ok': commitSeat();sheet=null;break;
    case 'seat-clear': delete state.seats[s.c];touch();sheet=null;break;
    case 'reset': sheet={kind:'reset'};break;
    case 'reset-ok': state.seats={};touch();sheet=null;break;
    case 'pdf': try{sheet={kind:'pdf',mode:'chart',urls:[drawSheet(state).toDataURL('image/jpeg',0.92)]};}catch(e){toast('プレビューを作れませんでした。もう一度お試しください。');return;}break;
    case 'cards':
      if(!total()){toast('先に席を押して、氏名を入れてください。');return;}
      try{sheet={kind:'pdf',mode:'cards',urls:drawCards(state).map(function(c){return c.toDataURL('image/jpeg',0.92);})};}catch(e){toast('席札を作れませんでした。もう一度お試しください。');return;}break;
    case 'pdf-save': savePdf();return;
    case 'print':
      var pb=document.getElementById('printbox'),land=s.mode!=='cards',hh='';
      for(var q=0;q<s.urls.length;q++)hh+='<img alt="" src="'+s.urls[q]+'">';
      pb.className=land?'ls':'pt';pb.innerHTML=hh;
      document.getElementById('pagestyle').textContent='@page{size:A4 '+(land?'landscape':'portrait')+';margin:0}';
      setTimeout(function(){window.print();},120);return;
    case 'share': sheet={kind:'share',url:shareUrl()};break;
    case 'share-copy': copyText(s.url);return;
    case 'share-send': try{navigator.share({title:(state.title||'席次表'),url:s.url}).catch(function(){});}catch(e){}return;
    case 'edit': sheet={kind:'edit'};break;
    case 'edit-ok': viewing=false;touch();sheet=null;try{history.replaceState(null,'',location.href.split('#')[0]);}catch(e){location.hash='';}break;
    default: return;
  }
  render();
}
app.addEventListener('click',function(e){
  var el=e.target;
  while(el&&el!==app&&!(el.getAttribute&&el.getAttribute('data-act')))el=el.parentNode;
  if(!el||el===app)return;
  var act=el.getAttribute('data-act');
  if(act==='ov'){if(e.target===el){sheet=null;render();}return;}
  if(el.disabled)return;
  onAct(act,el);
});
app.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='title'){state.title=e.target.value;touch();refreshStatus();}
  else if(id==='sub'){state.sub=e.target.value;touch();refreshStatus();}
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){
    if(e.target.id==='seat-name'){e.preventDefault();var nx=document.getElementById('seat-aff');if(nx){nx.focus();try{nx.select();}catch(er){}}}
    else if(e.target.id==='seat-aff'){e.preventDefault();onAct('seat-ok');}
    else if(e.target.id==='title'||e.target.id==='sub'){e.target.blur();}
  }else if(e.key==='Escape'&&sheet){sheet=null;render();}
});

/* ---------- print sheet (A4 landscape, drawn in millimetres) ---------- */
var PFONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif';
function drawSheet(st){
  var S=10,c=document.createElement('canvas');c.width=2970;c.height=2100;
  var g=c.getContext('2d');g.scale(S,S);
  g.fillStyle='#ffffff';g.fillRect(0,0,297,210);
  g.textBaseline='middle';g.lineJoin='miter';
  function setFont(sz,w){g.font=(w||'400')+' '+sz+'px '+PFONT;}
  function text(s,x,y,maxW,sz,w,align,color){
    var size=sz;setFont(size,w);
    while(g.measureText(s).width>maxW&&size>sz*0.62){size-=0.1;setFont(size,w);}
    g.textAlign=align||'center';g.fillStyle=color||'#111111';g.fillText(s,x,y,maxW);
  }
  function fits(s,maxW,sz,w){setFont(sz,w);return g.measureText(s).width<=maxW;}
  function split2(s){
    var mid=Math.ceil(s.length/2),best=-1,i;
    for(i=0;i<s.length;i++){if(s.charAt(i)===' '&&(best<0||Math.abs(i-mid)<Math.abs(best-mid)))best=i;}
    if(best>0&&best<s.length-1)return [s.slice(0,best),s.slice(best+1)];
    return [s.slice(0,mid),s.slice(mid)];
  }
  var ttl=(st.title||'').trim()||'席次表', sub=(st.sub||'').trim();
  text(ttl,148.5,sub?12:15,260,9.5,'700');
  if(sub)text(sub,148.5,20.5,260,4.6,'400','center','#333333');
  g.fillStyle='#1b1b1b';g.fillRect(98.5,26,100,6.5);text('前方',148.5,29.3,90,3.8,'700','center','#ffffff');

  var X0=10,W=277,GAP=7,BW=(W-GAP*3)/4,CW=BW/3,top=39,bottom=201,DH=20,pitch=(bottom-top-DH)/(ROWS-1);
  var n=0;
  for(var r=0;r<ROWS;r++){
    var y=top+r*pitch;
    for(var b=0;b<BLOCKS;b++){
      var bx=X0+b*(BW+GAP);
      for(var p=0;p<3;p++){
        var code=codeAt(b,p,r),s=st.seats[code],x=bx+p*CW,cx=x+CW/2,mw=CW-1.8;
        if(s&&s.c){g.fillStyle='#eeeeee';g.fillRect(x,y,CW,DH);}
        if(s){
          n++;
          text(code,cx,y+2.9,mw,2.9,'400','center','#333333');
          var ny=y+13.6;
          if(s.a){
            if(fits(s.a,mw,2.5,'400'))text(s.a,cx,y+6.8,mw,2.5,'400','center','#333333');
            else{var two=split2(s.a);text(two[0],cx,y+6.1,mw,2.3,'400','center','#333333');text(two[1],cx,y+8.9,mw,2.3,'400','center','#333333');ny=y+14.4;}
          }else ny=y+11.8;
          text(s.n,cx,ny,mw,4.8,s.c?'400':'700');
        }else if(p!==1){
          text(code,cx,y+2.9,mw,2.9,'400','center','#9a9a9a');
        }
      }
      g.strokeStyle='#111111';g.lineWidth=0.35;g.strokeRect(bx,y,BW,DH);
      g.beginPath();g.moveTo(bx+CW,y);g.lineTo(bx+CW,y+DH);g.moveTo(bx+CW*2,y);g.lineTo(bx+CW*2,y+DH);g.stroke();
    }
  }
  text('合計 '+n+' 名',287,206,60,3.6,'400','right','#555555');
  return c;
}

/* ---------- place cards (A4 portrait, 8 per page, one colour per clinic) ---------- */
var PALETTE=['#ffbe5c','#ff5757','#ffde59','#4caf3a','#e2abf0','#38b6ff','#5574ff','#ff7722','#5ce1c6','#ff9ec4','#c9e265','#b9a6ff','#d9b38c','#9fc3d9','#f4a6a6','#8fd3a0'];
function seatOrder(st){
  var list=[];
  for(var r=0;r<ROWS;r++)for(var i=0;i<COLS.length;i++){var c=COLS.charAt(i)+(r+1);if(st.seats[c])list.push({code:c,n:st.seats[c].n,a:st.seats[c].a});}
  return list;
}
function clinicColors(st){
  var map={},k=0;
  seatOrder(st).forEach(function(x){if(x.a&&!map[x.a]){map[x.a]=PALETTE[k%PALETTE.length];k++;}});
  return map;
}
function drawCards(st){
  var list=seatOrder(st),colors=clinicColors(st),order={},k=0;
  list.forEach(function(x){var key=x.a||'￿';if(!(key in order))order[key]=k++;});
  list.sort(function(p,q){var d=order[p.a||'￿']-order[q.a||'￿'];return d||0;});
  var pages=[],S=10,CWc=105,CHc=74.25;
  for(var start=0;start<list.length;start+=8){
    var c=document.createElement('canvas');c.width=2100;c.height=2970;
    var g=c.getContext('2d');g.scale(S,S);
    g.fillStyle='#ffffff';g.fillRect(0,0,210,297);g.textBaseline='middle';
    (function(g){
      function setFont(sz,w){g.font=(w||'400')+' '+sz+'px '+PFONT;}
      function fit(s,maxW,sz,w,min){var size=sz;setFont(size,w);while(g.measureText(s).width>maxW&&size>min){size-=0.2;setFont(size,w);}return size;}
      function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
      g.setLineDash([1.5,1.5]);g.strokeStyle='#bbbbbb';g.lineWidth=0.2;
      g.beginPath();g.moveTo(105,0);g.lineTo(105,297);for(var j=1;j<4;j++){g.moveTo(0,j*CHc);g.lineTo(210,j*CHc);}g.stroke();g.setLineDash([]);
      for(var i=0;i<8&&start+i<list.length;i++){
        var x0=(i%2)*CWc,y0=Math.floor(i/2)*CHc,it=list[start+i];
        rr(x0+9,y0+8,87,34,5);g.fillStyle=it.a?colors[it.a]:'#e6e6e6';g.fill();
        if(it.a){
          g.textAlign='center';g.fillStyle='#111111';
          if(fit(it.a,77,15,'700',4)>=7.6)g.fillText(it.a,x0+52.5,y0+25.4,77);
          else{
            var t=it.a,mid=Math.ceil(t.length/2),cut=-1,z;
            for(z=1;z<t.length-1;z++){if((t.charAt(z)===' '||t.charAt(z)==='\u3000')&&(cut<0||Math.abs(z-mid)<Math.abs(cut-mid)))cut=z;}
            var l1=cut>0?t.slice(0,cut):t.slice(0,mid),l2=cut>0?t.slice(cut+1):t.slice(mid);
            var sz=Math.min(fit(l1,77,11,'700',3.5),fit(l2,77,11,'700',3.5));setFont(sz,'700');
            g.fillText(l1,x0+52.5,y0+25.4-sz*0.62,77);g.fillText(l2,x0+52.5,y0+25.4+sz*0.62,77);
          }
        }
        setFont(6.6,'400');g.textAlign='right';g.fillStyle='#222222';g.fillText('さん',x0+94,y0+54.6);
        fit(it.n,62,10.5,'400',4.5);g.textAlign='center';g.fillStyle='#111111';g.fillText(it.n,x0+44,y0+53.4,62);
        g.strokeStyle='#4caf3a';g.lineWidth=0.8;g.beginPath();g.moveTo(x0+11,y0+60.4);g.lineTo(x0+94,y0+60.4);g.stroke();
        setFont(2.8,'400');g.textAlign='right';g.fillStyle='#999999';g.fillText(it.code,x0+94,y0+65.5);
      }
    })(g);
    pages.push(c);
  }
  return pages;
}

/* ---------- PDF (A4 pages, each holding one JPEG) ---------- */
function b64bytes(dataUrl){
  var b=atob(dataUrl.slice(dataUrl.indexOf(',')+1)),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;
}
function makePdf(pages){
  var parts=[],len=0,offs=[],N=pages.length;
  function put(x){var a;if(typeof x==='string'){a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i)&255;}else a=x;parts.push(a);len+=a.length;}
  function obj(n,body){offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n');}
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids='';for(var k=0;k<N;k++)kids+=(3+k*3)+' 0 R ';
  obj(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+N+' >>');
  for(k=0;k<N;k++){
    var pg=pages[k],po=3+k*3,io=po+1,co=po+2,land=pg.w>pg.h,pw=land?841.89:595.28,ph=land?595.28:841.89;
    obj(po,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>');
    offs[io]=len;
    put(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpeg.length+' >>\nstream\n');
    put(pg.jpeg);put('\nendstream\nendobj\n');
    var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(co,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  }
  var total=2+N*3,xref=len,x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(var n=1;n<=total;n++)x+=('0000000000'+offs[n]).slice(-10)+' 00000 n \n';
  put(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  var out=new Uint8Array(len),p=0;
  for(var i=0;i<parts.length;i++){out.set(parts[i],p);p+=parts[i].length;}
  return out;
}
function pdfBytes(mode){
  var cs=mode==='cards'?drawCards(state):[drawSheet(state)];
  return makePdf(cs.map(function(c){return {jpeg:b64bytes(c.toDataURL('image/jpeg',0.92)),w:c.width,h:c.height};}));
}
function savePdf(){
  var bytes,mode=sheet&&sheet.mode==='cards'?'cards':'chart';
  try{bytes=pdfBytes(mode);}catch(e){toast('PDFを作れませんでした。もう一度お試しください。');return;}
  try{
    var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    var a=document.createElement('a');a.href=url;a.download=mode==='cards'?'sekifuda.pdf':'sekijihyo.pdf';a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},4000);
    toast('PDFを保存しました。');
  }catch(e){toast('PDFを保存できませんでした。「このまま印刷」をお試しください。');}
}
function copyText(t){
  function fallback(){
    var el=document.getElementById('share-url'),ok=false;
    if(el){el.focus();el.select();try{el.setSelectionRange(0,t.length);}catch(e){}try{ok=document.execCommand('copy');}catch(e){}}
    toast(ok?'リンクをコピーしました。':'コピーできませんでした。リンクを長押ししてコピーしてください。');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('リンクをコピーしました。');},fallback);}
  else fallback();
}

load();
render();
window.addEventListener('hashchange',function(){sheet=null;load();render();});
window.__sekiji={shareUrl:shareUrl,pdfBytes:pdfBytes,clinicColors:function(){return clinicColors(state);},getState:function(){return state;}};
})();
