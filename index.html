<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>席次表メーカー</title><style id="css">
/* layout idea: the room seen from above, screen wall on top, four blocks of three-seat desks in six rows; a sticky action bar below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16232e; --muted:#5b6b78; --line:#c5ced6;
  --accent:#0d6b63; --accent-ink:#ffffff; --desk:#e6d8bd; --desk-ink:#4b3d22;
  --child:#fff3c9; --danger:#b3261e;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171d; --surface:#1a242c; --ink:#e8eef2; --muted:#9fb0bc; --line:#3a4854;
    --accent:#3fb8ac; --accent-ink:#06211e; --desk:#4d4330; --desk-ink:#f1e4c6;
    --child:#4a4222; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171d; --surface:#1a242c; --ink:#e8eef2; --muted:#9fb0bc; --line:#3a4854;
  --accent:#3fb8ac; --accent-ink:#06211e; --desk:#4d4330; --desk-ink:#f1e4c6;
  --child:#4a4222; --danger:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 160px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:6px}
.head input{width:100%;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;padding:4px 2px;border-radius:4px}
.head input:focus{border-color:var(--accent);background:var(--surface);outline:none}
#title{font-size:22px;font-weight:700}
#sub{font-size:14px;color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.room{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 12px;display:flex;flex-direction:column;gap:14px}
.front{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:6px;align-items:stretch;font-size:11px;text-align:center}
.front span{display:flex;align-items:center;justify-content:center;min-height:30px;border-radius:4px;padding:2px 4px}
.wc{border:1px solid var(--line);color:var(--muted)}
.screen{background:var(--ink);color:var(--surface);font-weight:700;letter-spacing:.04em}
.stairs{border:1px solid var(--line);color:var(--muted);background:repeating-linear-gradient(90deg,transparent 0 7px,var(--line) 7px 8px)}
.stairs b{background:var(--surface);padding:0 4px;font-weight:400}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.tbl{display:flex;flex-direction:column;gap:4px;min-width:0}
.end{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.end .chair,.end .add{flex:0 1 46%}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);gap:4px;align-items:stretch}
.side{display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.desk{border:2px solid var(--desk-ink);background:var(--desk);color:var(--desk-ink);border-radius:6px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:100px}
.desk strong{font-size:20px;line-height:1.1;word-break:break-all;text-align:center}
.desk small{font-size:10px;line-height:1.2;text-align:center}
.chair{min-height:44px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 4px;font-size:13px;line-height:1.25;word-break:break-all;color:var(--muted);min-width:0}
.chair.on{border-color:var(--accent);background:var(--surface);color:var(--ink);font-weight:700}
.chair .aff{display:block;font-weight:400;font-size:10px;line-height:1.2;color:var(--muted)}
.chair.kid{background:var(--child);font-size:12px}
.chair.kid::after{content:"（子）";font-weight:400;font-size:10px;color:var(--muted)}
.add{min-height:30px;border:1.5px dashed var(--line);background:transparent;border-radius:8px;color:var(--muted);font-size:12px;padding:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.status{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btn{flex:1;min-height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;padding:6px 8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--danger)}
.btn.slim{flex:0 0 auto}
.btn:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:16px}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.sheet label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input[type=text]{border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:18px;background:var(--bg);color:var(--ink);width:100%}
.sheet label.c{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.sheet label.c input{width:22px;height:22px;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pv{background:#fff;border:1px solid var(--line);max-width:100%;height:auto;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:90%;text-align:center}
#printbox{display:none}
.pv+.pv{margin-top:8px}
.btns+.btns{margin-top:0}
.view .add{display:none}
.share-url{font-size:12px !important;word-break:break-all}
@media print{html,body{background:#fff}#app{display:none}#printbox{display:block}#printbox img{display:block;page-break-after:always;break-after:page}#printbox img:last-child{page-break-after:auto;break-after:auto}#printbox.ls img{width:297mm;height:210mm}#printbox.pt img{width:210mm;height:297mm}}
@media (min-width:600px){.chair{font-size:15px}.mid{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}.ov{align-items:center}.sheet{border-radius:14px}}

.room{padding:8px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 8px 6px}
.grid{display:flex;flex-direction:column;gap:14px;min-width:820px}
.frontbar{align-self:center;background:var(--ink);color:var(--surface);font-weight:700;font-size:12px;letter-spacing:.2em;padding:4px 60px;border-radius:4px}
.rw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.desk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--desk-ink);border-radius:6px;overflow:hidden;background:var(--desk)}
.seat{min-height:64px;border:0;border-right:1px solid var(--desk-ink);background:var(--surface);padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.2;word-break:break-all;text-align:center}
.seat:last-child{border-right:0}
.seat .code{font-size:10px;color:var(--muted)}
.seat .aff{font-size:9px;color:var(--muted)}
.seat .nm{font-size:13px;font-weight:700;color:var(--ink);margin:auto 0}
.seat .empty{font-size:12px;color:var(--muted);margin:auto 0}
.seat.mid:not(.on){background:transparent}
.seat.mid:not(.on) .code{opacity:.55}
.seat.on{box-shadow:inset 0 0 0 2px var(--accent)}
.seat.kid{background:var(--child)}
.seat:focus-visible{outline-offset:-3px}

.seat{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.seat .trees{display:flex;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:700;color:#1f8a3b;line-height:1}
.seat .tree{width:11px;height:13px;fill:#1f8a3b}
.seat .kd{font-size:9px;color:var(--muted)}
.seat.bad{box-shadow:inset 0 0 0 3px var(--danger)}
.seat.dragging{opacity:.35}
.seat.drop{box-shadow:inset 0 0 0 4px var(--accent);background:var(--child)}
.drag-on,.drag-on *{cursor:grabbing !important}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
.warn-box{border:1.5px solid var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface)}
.warn-box strong{color:var(--danger)}
.warn-box ul{margin:4px 0 0;padding-left:18px}
.bad-text{color:var(--danger) !important}
.sheet select,.sheet textarea,.sheet input[type=number],.sheet input[type=file]{border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink);width:100%;font-family:inherit}
</style></head><body><div id="app"></div><div id="printbox"></div><style id="pagestyle"></style><script>
(function(){
'use strict';
var LS_KEY='sekiji-draft-v2';
var COLS='ABCDEFGHIJKL', ROWS=6, BLOCKS=4;
var app=document.getElementById('app');
var state, viewing=false, sheet=null, toastMsg='', toastTimer=0;

function defaultState(){return {rev:0,title:'席次表',sub:'',seats:{}};}
function validCode(c){return typeof c==='string'&&/^[A-L][1-6]$/.test(c);}
function clean(o){
  if(!o||typeof o!=='object'||!o.seats||typeof o.seats!=='object')return null;
  var out={rev:+o.rev||0,title:String(o.title||''),sub:String(o.sub||''),seats:{}};
  Object.keys(o.seats).forEach(function(c){
    var x=o.seats[c];if(!validCode(c)||!x)return;
    var n=String(x.n||'').trim();if(!n)return;
    var k=(x.k==='p'||x.k==='e')?x.k:(x.c&&!x.k?'e':'a'),t=parseInt(x.t,10);
    out.seats[c]={n:n,a:String(x.a||'').trim(),k:k,t:(t>0&&t<100)?t:0,f:String(x.f||'').trim()};
  });
  return out;
}
function loadDraft(){
  var d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY));}catch(e){}
  return clean(d);
}
function touch(){
  if(viewing)return;
  state.rev=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function total(){return Object.keys(state.seats).length;}
function treeTotal(){var n=0;Object.keys(state.seats).forEach(function(c){n+=state.seats[c].t||0;});return n;}
var TREE='<svg class="tree" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 0l4 5H8l3.5 4.5H7V14H5V9.5H.5L4 5H2z"/></svg>';
function treesHtml(t){if(!t)return '';if(t>3)return '<span class="trees">'+TREE+'×'+t+'</span>';var h='';for(var i=0;i<t;i++)h+=TREE;return '<span class="trees">'+h+'</span>';}
var KIND={a:'',e:'小学生',p:'未就学'};
function codeAt(block,pos,row){return COLS.charAt(block*3+pos)+(row+1);}

/* ---------- screen ---------- */
function seatHtml(code,mid,bad){
  var s=state.seats[code];
  var cls='seat'+(mid?' mid':'')+(s?' on':'')+(s&&s.k!=='a'?' kid':'')+(bad?' bad':'');
  var body=s?(treesHtml(s.t)+(s.a?'<small class="aff">'+esc(s.a)+'</small>':'')+'<span class="nm">'+esc(s.n)+'</span>'+(s.k!=='a'?'<small class="kd">'+KIND[s.k]+'</small>':'')):'<span class="empty">'+(mid?(viewing?'':'＋'):'空席')+'</span>';
  return '<button type="button" class="'+cls+'" data-act="seat" data-c="'+code+'" aria-label="'+code+'の席 '+(s?esc(s.n):(mid?'真ん中・未使用':'空席'))+'"><small class="code">'+code+'</small>'+body+'</button>';
}
function statusText(){return viewing?'共有された席次表（見るだけ）':'この端末に自動保存しています';}
function render(){
  var keep=document.activeElement&&document.activeElement.id;
  var sc=document.getElementById('scroll'),sl=sc?sc.scrollLeft:0;
  var ro=viewing?' readonly':'';
  var warns=validate(state),badSet={};warns.forEach(function(w){badSet[w.code]=1;});
  var h='<div class="wrap'+(viewing?' view':'')+'"><header class="head">'+
    '<input id="title" type="text" aria-label="タイトル" placeholder="タイトル" value="'+esc(state.title)+'"'+ro+'>'+
    '<input id="sub" type="text" aria-label="日付・会の名前" placeholder="日付・会の名前（印刷に入ります）" value="'+esc(state.sub)+'"'+ro+'>'+
    '<p class="hint">'+(viewing?'送られてきた席次表です。「席次表PDF」「席札PDF」から印刷できます。':'席を押すと氏名などを直せます。席を長押ししてから動かすと、ほかの席と入れ替えられます。表は横に動かせます。')+'</p>'+
    (viewing?'':'<div class="row"><button type="button" class="btn" data-act="import">名簿（Excel）から自動で席を決める</button></div>')+'</header>'+warnHtml(warns)+
    '<div class="room"><div id="scroll" class="scroll"><div class="grid"><div class="frontbar">前方</div>';
  for(var r=0;r<ROWS;r++){
    h+='<div class="rw">';
    for(var b=0;b<BLOCKS;b++){
      h+='<div class="desk3">'+seatHtml(codeAt(b,0,r),false,badSet[codeAt(b,0,r)])+seatHtml(codeAt(b,1,r),true,badSet[codeAt(b,1,r)])+seatHtml(codeAt(b,2,r),false,badSet[codeAt(b,2,r)])+'</div>';
    }
    h+='</div>';
  }
  h+='</div></div></div></div>'+
    '<div class="bar"><div class="bar-in"><div class="status"><span id="st">'+esc(statusText())+'</span><span>合計 '+total()+' 名・ツリー '+treeTotal()+' 個</span></div>'+
    '<div class="btns"><button type="button" class="btn pri" data-act="pdf">席次表PDF</button><button type="button" class="btn pri" data-act="cards">席札PDF</button></div>'+
    '<div class="btns">'+(viewing?'<button type="button" class="btn" data-act="edit">自分で編集する</button>'
      :'<button type="button" class="btn" data-act="share">リンクで共有</button><button type="button" class="btn slim warn" data-act="reset">リセット</button>')+
    '</div></div></div>';
  if(sheet)h+='<div class="ov" data-act="ov"><div class="sheet" role="dialog" aria-modal="true">'+sheetHtml()+'</div></div>';
  if(toastMsg)h+='<div class="toast" role="status">'+esc(toastMsg)+'</div>';
  app.innerHTML=h;
  sc=document.getElementById('scroll');if(sc)sc.scrollLeft=sl;
  if(sheet&&sheet.focus){var f=document.getElementById(sheet.focus);if(f){f.focus();try{f.select();}catch(e){}}sheet.focus=null;}
  else if(keep&&!sheet){var k=document.getElementById(keep);if(k)k.focus();}
}
function warnHtml(w){
  if(!w.length)return '';
  var h='<div class="warn-box" role="alert"><strong>確認が必要な席が '+w.length+' 件あります</strong><ul>';
  for(var i=0;i<w.length&&i<6;i++)h+='<li>'+esc(w[i].code)+'：'+esc(w[i].msg)+'</li>';
  if(w.length>6)h+='<li>ほか '+(w.length-6)+' 件</li>';
  return h+'</ul></div>';
}
function refreshStatus(){var el=document.getElementById('st');if(el)el.textContent=statusText();}
function toast(m){toastMsg=m;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';render();},3500);render();}

function sheetHtml(){
  var s=sheet,x;
  if(s.kind==='seat'){
    x=state.seats[s.c]||{n:'',a:'',k:'a',t:0};
    return '<h2>'+s.c+' の席</h2>'+
      '<label class="f" for="seat-name">氏名<input id="seat-name" type="text" autocomplete="off" enterkeyhint="next" value="'+esc(x.n)+'"></label>'+
      '<label class="f" for="seat-aff">所属病院名（空欄でもかまいません）<input id="seat-aff" type="text" autocomplete="off" enterkeyhint="done" value="'+esc(x.a)+'"></label>'+
      '<label class="f" for="seat-kind">区分<select id="seat-kind"><option value="a"'+(x.k==='a'?' selected':'')+'>大人</option><option value="e"'+(x.k==='e'?' selected':'')+'>小学生（F小）</option><option value="p"'+(x.k==='p'?' selected':'')+'>未就学（F未）</option></select></label>'+
      '<label class="f" for="seat-trees">ツリーの数（制作）<input id="seat-trees" type="number" inputmode="numeric" min="0" max="20" value="'+(x.t||0)+'"></label>'+
      '<div class="row"><button type="button" class="btn pri" data-act="seat-ok">決定</button><button type="button" class="btn" data-act="close">やめる</button></div>'+
      (state.seats[s.c]?'<div class="row"><button type="button" class="btn warn" data-act="seat-clear">空席に戻す</button></div>':'');
  }
  if(s.kind==='import'){
    return '<h2>名簿から自動で席を決める</h2><p>Excelファイル（.xlsx）を選ぶか、表をコピーして下の欄に貼り付けてください。「医療機関・氏名・ふりがな・職種・制作」の見出しの行も含めてください。</p>'+
      '<label class="f" for="roster-file">Excelファイルを選ぶ<input id="roster-file" type="file" accept=".xlsx,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"></label>'+
      '<label class="f" for="roster-text">または、表を貼り付ける<textarea id="roster-text" rows="5" placeholder="表をコピーして、ここに貼り付け"></textarea></label>'+
      '<div class="row"><button type="button" class="btn pri" data-act="import-text">貼り付けた表を読み込む</button><button type="button" class="btn" data-act="close">やめる</button></div>';
  }
  if(s.kind==='import-ok'){
    var pl=s.plan,kids=s.people.filter(function(p){return p.k!=='a';}).length,ws=validate({seats:pl.seats});
    var h='<h2>名簿を読み込みました</h2><p>'+pl.people+' 名・'+pl.clinics+' 医院（うち子ども '+kids+' 名）。同じ医院が固まり、子どもは保護者と同じ机になるように席を決めます。</p>';
    if(pl.packed)h+='<p>人数が多いため、大人だけの机も真ん中の席まで使います。</p>';
    if(pl.unplaced.length)h+='<p class="bad-text">席が足りず、次の '+pl.unplaced.length+' 名は入りませんでした：'+esc(pl.unplaced.map(function(p){return p.name;}).join('、'))+'</p>';
    if(ws.length)h+='<p class="bad-text">保護者が見つからない子どもなど、確認が必要な席が '+ws.length+' 件あります。席を決めたあと画面の上に表示されます。</p>';
    if(total())h+='<p class="bad-text">今入っている席はすべて置き換わります。</p>';
    return h+'<div class="row"><button type="button" class="btn pri" data-act="import-apply">この内容で席を決める</button><button type="button" class="btn" data-act="close">やめる</button></div>';
  }
  if(s.kind==='reset'){
    return '<h2>リセット</h2><p>入力した氏名と所属をすべて消します。消したあとは元に戻せません。</p>'+
      '<div class="row"><button type="button" class="btn warn" data-act="reset-ok">全部消す</button><button type="button" class="btn" data-act="close">やめる</button></div>';
  }
  if(s.kind==='pdf'){
    var imgs='';for(var i=0;i<s.urls.length;i++)imgs+='<img class="pv" alt="印刷プレビュー '+(i+1)+'ページ目" src="'+s.urls[i]+'">';
    return '<h2>'+(s.mode==='cards'?'席札プレビュー（A4縦・1枚に8人分・全'+s.urls.length+'ページ）':'印刷プレビュー（A4横）')+'</h2>'+
      (s.mode==='cards'?'<p>点線で切り離して使います。色はクリニックごとに自動で分かれます。</p>':'')+
      '<div class="row"><button type="button" class="btn pri" data-act="pdf-save">PDFを保存</button><button type="button" class="btn" data-act="print">このまま印刷</button></div>'+
      imgs+
      '<div class="row"><button type="button" class="btn" data-act="close">閉じる</button></div>';
  }
  if(s.kind==='share'){
    return '<h2>リンクで共有</h2><p>このリンクを送ると、相手は今の席次表を見て印刷できます。あとで内容を変えたら、もう一度リンクを送り直してください。</p>'+

function commitSeat(){
  var s=sheet;if(!s||s.kind!=='seat')return;
  var n=document.getElementById('seat-name'),af=document.getElementById('seat-aff'),k=document.getElementById('seat-kind'),tr=document.getElementById('seat-trees');

    state.seats[s.c]={n:name,a:af?af.value.replace(/[\s\u3000]+/g,' ').trim():'',k:(kv==='p'||kv==='e')?kv:'a',t:(t>0&&t<100)?t:0,
      f:(old&&old.f&&surname(old.n)===surname(name))?old.f:''};
  }

}
function onAct(act,el){
  var s=sheet;
  if(viewing&&!/^(pdf|cards|pdf-save|print|close|edit|edit-ok)$/.test(act))return;
  switch(act){
    case 'seat': sheet={kind:'seat',c:el.getAttribute('data-c'),focus:'seat-name'};break;
    case 'close': sheet=null;break;
    case 'seat-ok': commitSeat();sheet=null;break;
    case 'seat-clear': delete state.seats[s.c];touch();sheet=null;break;
    case 'import': sheet={kind:'import'};break;
    case 'import-text':
      var ta=document.getElementById('roster-text'),txt=ta?ta.value:'';

      try{importDone(rowsToPeople(parseDelimited(txt)));}catch(e){toast(importError(e));}
      return;
    case 'import-apply': state.seats=s.plan.seats;touch();sheet=null;break;
    case 'reset': sheet={kind:'reset'};break;
    case 'reset-ok': state.seats={};touch();sheet=null;break;
    case 'pdf': try{sheet={kind:'pdf',mode:'chart',urls:[drawSheet(state).toDataURL('image/jpeg',0.92)]};}catch(e){toast('プレビューを作れませんでした。もう一度お試しください。');return;}break;
    case 'cards':
      if(!total()){toast('先に席を押して、氏名を入れてください。');return;}
      try{sheet={kind:'pdf',mode:'cards',urls:drawCards(state).map(function(c){return c.toDataURL('image/jpeg',0.92);})};}catch(e){toast('席札を作れませんでした。もう一度お試しください。');return;}break;
    case 'pdf-save': savePdf();return;
    case 'print':
      var pb=document.getElementById('printbox'),land=s.mode!=='cards',hh='';
      for(var q=0;q<s.urls.length;q++)hh+='<img alt="" src="'+s.urls[q]+'">';
      pb.className=land?'ls':'pt';pb.innerHTML=hh;
      document.getElementById('pagestyle').textContent='@page{size:A4 '+(land?'landscape':'portrait')+';margin:0}';
      setTimeout(function(){window.print();},120);return;
    case 'share': shareUrl().then(function(u){sheet={kind:'share',url:u};render();},function(){toast('リンクを作れませんでした。もう一度お試しください。');});return;
    case 'share-copy': copyText(s.url);return;
    case 'share-send': try{navigator.share({title:(state.title||'席次表'),url:s.url}).catch(function(){});}catch(e){}return;
    case 'edit': sheet={kind:'edit'};break;
    case 'edit-ok': viewing=false;touch();sheet=null;try{history.replaceState(null,'',location.href.split('#')[0]);}catch(e){location.hash='';}break;
    default: return;
  }
  render();
}

/* ---------- print sheet (A4 landscape, drawn in millimetres) ---------- */
var PFONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif';
function drawSheet(st){
  var S=10,c=document.createElement('canvas');c.width=2970;c.height=2100;
  var g=c.getContext('2d');g.scale(S,S);
  g.fillStyle='#ffffff';g.fillRect(0,0,297,210);
  g.textBaseline='middle';g.lineJoin='miter';
  function setFont(sz,w){g.font=(w||'400')+' '+sz+'px '+PFONT;}
  function text(s,x,y,maxW,sz,w,align,color){
    var size=sz;setFont(size,w);
    while(g.measureText(s).width>maxW&&size>sz*0.62){size-=0.1;setFont(size,w);}
    g.textAlign=align||'center';g.fillStyle=color||'#111111';g.fillText(s,x,y,maxW);
  }
  function fits(s,maxW,sz,w){setFont(sz,w);return g.measureText(s).width<=maxW;}
  function split2(s){
    var mid=Math.ceil(s.length/2),best=-1,i;
    for(i=0;i<s.length;i++){if(s.charAt(i)===' '&&(best<0||Math.abs(i-mid)<Math.abs(best-mid)))best=i;}
    if(best>0&&best<s.length-1)return [s.slice(0,best),s.slice(best+1)];
    return [s.slice(0,mid),s.slice(mid)];
  }
  function tree(cx,base,h){
    var u=h/14,x=cx-6*u,y=base-h,pts=[[6,0],[10,5],[8,5],[11.5,9.5],[7,9.5],[7,14],[5,14],[5,9.5],[0.5,9.5],[4,5],[2,5]];
    g.beginPath();pts.forEach(function(p,i){if(i)g.lineTo(x+p[0]*u,y+p[1]*u);else g.moveTo(x+p[0]*u,y+p[1]*u);});g.closePath();g.fillStyle='#1f8a3b';g.fill();
  }
  function trees(cx,base,n){
    var h=5.6,step=5.4;
    if(n>3){tree(cx-3,base,h);text('×'+n,cx+3.2,base-h/2,8,3.6,'700','center','#1f8a3b');return;}
    for(var i=0;i<n;i++)tree(cx+(i-(n-1)/2)*step,base,h);
  }
  var ttl=(st.title||'').trim()||'席次表', sub=(st.sub||'').trim();
  text(ttl,148.5,sub?12:15,260,9.5,'700');
  if(sub)text(sub,148.5,20.5,260,4.6,'400','center','#333333');
  g.fillStyle='#1b1b1b';g.fillRect(98.5,26,100,6.5);text('前方',148.5,29.3,90,3.8,'700','center','#ffffff');

  var X0=10,W=277,GAP=7,BW=(W-GAP*3)/4,CW=BW/3,top=39,bottom=201,DH=20,pitch=(bottom-top-DH)/(ROWS-1);
  var n=0;
  for(var r=0;r<ROWS;r++){
    var y=top+r*pitch;
    for(var b=0;b<BLOCKS;b++){
      var bx=X0+b*(BW+GAP);
      for(var p=0;p<3;p++){
        var code=codeAt(b,p,r),s=st.seats[code],x=bx+p*CW,cx=x+CW/2,mw=CW-1.8;
        if(s&&s.k!=='a'){g.fillStyle='#eeeeee';g.fillRect(x,y,CW,DH);}
        if(s&&s.t)trees(cx,y-0.9,s.t);
        if(s){
          n++;
          text(code,cx,y+2.9,mw,2.9,'400','center','#333333');
          var ny=y+13.6;
          if(s.a){
            if(fits(s.a,mw,2.5,'400'))text(s.a,cx,y+6.8,mw,2.5,'400','center','#333333');
            else{var two=split2(s.a);text(two[0],cx,y+6.1,mw,2.3,'400','center','#333333');text(two[1],cx,y+8.9,mw,2.3,'400','center','#333333');ny=y+14.4;}
          }else ny=y+11.8;
          text(s.n,cx,ny,mw,4.8,s.k!=='a'?'400':'700');
        }else if(p!==1){
          text(code,cx,y+2.9,mw,2.9,'400','center','#9a9a9a');
        }
      }
      g.strokeStyle='#111111';g.lineWidth=0.35;g.strokeRect(bx,y,BW,DH);
      g.beginPath();g.moveTo(bx+CW,y);g.lineTo(bx+CW,y+DH);g.moveTo(bx+CW*2,y);g.lineTo(bx+CW*2,y+DH);g.stroke();
    }
  }
  var tt=0;Object.keys(st.seats).forEach(function(c){tt+=st.seats[c].t||0;});
  text('合計 '+n+' 名・ツリー '+tt+' 個',287,206,90,3.6,'400','right','#555555');
  return c;
}

/* ---------- place cards (A4 portrait, 8 per page, one colour per clinic) ---------- */
var PALETTE=['#ffbe5c','#ff5757','#ffde59','#4caf3a','#e2abf0','#38b6ff','#5574ff','#ff7722','#5ce1c6','#ff9ec4','#c9e265','#b9a6ff','#d9b38c','#9fc3d9','#f4a6a6','#8fd3a0'];
function seatOrder(st){
  var list=[];
  for(var r=0;r<ROWS;r++)for(var i=0;i<COLS.length;i++){var c=COLS.charAt(i)+(r+1);if(st.seats[c])list.push({code:c,n:st.seats[c].n,a:st.seats[c].a});}
  return list;
}
function clinicColors(st){
  var map={},k=0;

function drawCards(st){
  var list=seatOrder(st),colors=clinicColors(st),order={},k=0;
  list.forEach(function(x){var key=x.a||'￿';if(!(key in order))order[key]=k++;});
  list.sort(function(p,q){var d=order[p.a||'￿']-order[q.a||'￿'];return d||0;});

    var g=c.getContext('2d');g.scale(S,S);

    (function(g){
      function setFont(sz,w){g.font=(w||'400')+' '+sz+'px '+PFONT;}
      function fit(s,maxW,sz,w,min){var size=sz;setFont(size,w);while(g.measureText(s).width>maxW&&size>min){size-=0.2;setFont(size,w);}return size;}
      function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
      g.setLineDash([1.5,1.5]);g.strokeStyle='#bbbbbb';g.lineWidth=0.2;
      g.beginPath();g.moveTo(105,0);g.lineTo(105,297);for(var j=1;j<4;j++){g.moveTo(0,j*CHc);g.lineTo(210,j*CHc);}g.stroke();g.setLineDash([]);
      for(var i=0;i<8&&start+i<list.length;i++){
        var x0=(i%2)*CWc,y0=Math.floor(i/2)*CHc,it=list[start+i];
        rr(x0+9,y0+8,87,34,5);g.fillStyle=it.a?colors[it.a]:'#e6e6e6';g.fill();
        if(it.a){
          g.textAlign='center';g.fillStyle='#111111';
          if(fit(it.a,77,15,'700',4)>=7.6)g.fillText(it.a,x0+52.5,y0+25.4,77);
          else{
            var t=it.a,mid=Math.ceil(t.length/2),cut=-1,z;
            for(z=1;z<t.length-1;z++){if((t.charAt(z)===' '||t.charAt(z)==='\u3000')&&(cut<0||Math.abs(z-mid)<Math.abs(cut-mid)))cut=z;}
            var l1=cut>0?t.slice(0,cut):t.slice(0,mid),l2=cut>0?t.slice(cut+1):t.slice(mid);
            var sz=Math.min(fit(l1,77,11,'700',3.5),fit(l2,77,11,'700',3.5));setFont(sz,'700');
            g.fillText(l1,x0+52.5,y0+25.4-sz*0.62,77);g.fillText(l2,x0+52.5,y0+25.4+sz*0.62,77);
          }
        }
        setFont(6.6,'400');g.textAlign='right';g.fillStyle='#222222';g.fillText('さん',x0+94,y0+54.6);
        fit(it.n,62,10.5,'400',4.5);g.textAlign='center';g.fillStyle='#111111';g.fillText(it.n,x0+44,y0+53.4,62);
        g.strokeStyle='#4caf3a';g.lineWidth=0.8;g.beginPath();g.moveTo(x0+11,y0+60.4);g.lineTo(x0+94,y0+60.4);g.stroke();
        setFont(2.8,'400');g.textAlign='right';g.fillStyle='#999999';g.fillText(it.code,x0+94,y0+65.5);
      }
    })(g);
    pages.push(c);
  }

/* ---------- PDF (A4 pages, each holding one JPEG) ---------- */
function b64bytes(dataUrl){
  var b=atob(dataUrl.slice(dataUrl.indexOf(',')+1)),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;
}
function makePdf(pages){
  var parts=[],len=0,offs=[],N=pages.length;
  function put(x){var a;if(typeof x==='string'){a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i)&255;}else a=x;parts.push(a);len+=a.length;}
  function obj(n,body){offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n');}
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids='';for(var k=0;k<N;k++)kids+=(3+k*3)+' 0 R ';
  obj(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+N+' >>');
  for(k=0;k<N;k++){
    var pg=pages[k],po=3+k*3,io=po+1,co=po+2,land=pg.w>pg.h,pw=land?841.89:595.28,ph=land?595.28:841.89;
    obj(po,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>');
    offs[io]=len;
    put(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpeg.length+' >>\nstream\n');
    put(pg.jpeg);put('\nendstream\nendobj\n');
    var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(co,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  }
  var total=2+N*3,xref=len,x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(var n=1;n<=total;n++)x+=('0000000000'+offs[n]).slice(-10)+' 00000 n \n';
  put(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  var out=new Uint8Array(len),p=0;
  for(var i=0;i<parts.length;i++){out.set(parts[i],p);p+=parts[i].length;}
  return out;
}
function pdfBytes(mode){
  var cs=mode==='cards'?drawCards(state):[drawSheet(state)];
  return makePdf(cs.map(function(c){return {jpeg:b64bytes(c.toDataURL('image/jpeg',0.92)),w:c.width,h:c.height};}));
}
function savePdf(){

/* ---------- roster import: spreadsheet rows -> people ---------- */
function norm(s){return String(s==null?'':s).replace(/[\s　]+/g,' ').trim();}
function surname(s){return norm(s).split(' ')[0]||'';}
function kindOf(role){var r=norm(role);if(r.indexOf('未')>=0)return 'p';if(r.indexOf('小')>=0)return 'e';return 'a';}
function rowsToPeople(rows){
  var hi=-1,ci={},i,j;
  for(i=0;i<rows.length&&hi<0;i++){var rw=rows[i]||[];for(j=0;j<rw.length;j++){if(norm(rw[j]).replace(/ /g,'')==='氏名'){hi=i;break;}}}
  if(hi<0)throw new Error('noheader');
  for(j=0;j<rows[hi].length;j++){
    var t=norm(rows[hi][j]).replace(/ /g,'');
    if(t==='氏名')ci.name=j;
    else if(/ふりがな|フリガナ|よみ/.test(t)){if(ci.kana==null)ci.kana=j;}
    else if(/医療機関|医院|所属|クリニック|病院/.test(t)){if(ci.clinic==null)ci.clinic=j;}
    else if(/職種/.test(t)){if(ci.role==null)ci.role=j;}
    else if(/制作|製作/.test(t)){if(ci.trees==null)ci.trees=j;}
  }
  var people=[],clinic='';
  for(i=hi+1;i<rows.length;i++){
    var r=rows[i]||[];
    var get=function(k){return ci[k]==null?'':norm(r[ci[k]]);};
    var c=get('clinic');if(c)clinic=c;
    var name=get('name'),kana=get('kana');if(!name&&!kana)continue;
    var tr=parseInt(get('trees'),10);
    people.push({name:name||kana,rawName:name,kana:kana,clinic:clinic,k:kindOf(get('role')),t:(tr>0&&tr<100)?tr:0});
  }
  var maps={};
  people.forEach(function(p){if(p.rawName&&p.kana){var m=maps[p.clinic]||(maps[p.clinic]={});m[surname(p.rawName)]=surname(p.kana);}});
  people.forEach(function(p){var m=maps[p.clinic]||{};p.f=p.kana?surname(p.kana):(m[surname(p.rawName)]||surname(p.rawName));});
  return people;
}

/* ---------- automatic seating ---------- */
function planSeats(people){
  var clinics=[],cmap={};
  people.forEach(function(p){
    var c=cmap['c:'+p.clinic];if(!c){c=cmap['c:'+p.clinic]={fams:[],fmap:{}};clinics.push(c);}
    var f=c.fmap['f:'+p.f];if(!f){f=c.fmap['f:'+p.f]=[];c.fams.push(f);}
    f.push(p);
  });
  function layout(d){
    var a=d.a,k=d.k;
    if(a.length===2)return [a[0],k[0]||null,a[1]];
    if(a.length===1&&k.length===2)return [k[0],a[0],k[1]];
    if(a.length===1&&k.length===1)return k[0].k==='p'?[a[0],k[0],null]:[a[0],null,k[0]];
    if(a.length===1)return [a[0],null,null];
    if(k.length===2)return [k[0],null,k[1]];
    return [k[0],null,null];
  }
  function build(per){
    return clinics.map(function(c){
      var desks=[],pool=[];
      c.fams.forEach(function(f){
        var ad=f.filter(function(p){return p.k==='a';});
        var kids=f.filter(function(p){return p.k==='p';}).concat(f.filter(function(p){return p.k==='e';}));
        if(!kids.length){pool=pool.concat(ad);return;}
        var nd=Math.max(Math.ceil(kids.length/2),Math.min(ad.length,kids.length)),ds=[],i;
        for(i=0;i<nd;i++)ds.push({a:ad.length?[ad.shift()]:[],k:[]});
        kids.forEach(function(kid){
          var best=null,bs=99;
          ds.forEach(function(d){if(d.k.length>=2)return;var sc=d.k.length*2+(d.a.length?0:1);if(sc<bs){bs=sc;best=d;}});
          best.k.push(kid);
        });
        ds.forEach(function(d){if(ad.length&&d.a.length===1&&d.k.length===1)d.a.push(ad.shift());});
        ds.forEach(function(d){desks.push(layout(d));});
        pool=pool.concat(ad);
      });
      while(pool.length){
        var take=pool.splice(0,per);
        desks.push(take.length===3?[take[0],take[1],take[2]]:[take[0]||null,null,take[1]||null]);
      }
      return desks;
    });
  }
  function count(pl){var n=0;pl.forEach(function(d){n+=d.length;});return n;}
  var MAX=BLOCKS*ROWS,plan=build(2),packed=false;
  if(count(plan)>MAX){plan=build(3);packed=true;}
  var seats={},idx=0,unplaced=[];
  plan.forEach(function(desks){
    desks.forEach(function(d){
      if(idx>=MAX){d.forEach(function(p){if(p)unplaced.push(p);});return;}
      /* snake order: down the first block, up the next, so a clinic that crosses into the next block stays side by side */
      var b=Math.floor(idx/ROWS),r=b%2===0?idx%ROWS:ROWS-1-idx%ROWS;
      d.forEach(function(p,pos){if(p)seats[codeAt(b,pos,r)]={n:p.name,a:p.clinic,k:p.k,t:p.t,f:p.f};});
      idx++;
    });
  });
  return {seats:seats,unplaced:unplaced,packed:packed,people:people.length,clinics:clinics.length};
}

/* ---------- rule check (shown as warnings, never blocks) ---------- */
function famKey(s){return (s.a||'')+'|'+(s.f||surname(s.n));}
function validate(st){
  var w=[];
  for(var r=0;r<ROWS;r++)for(var b=0;b<BLOCKS;b++){
    var codes=[codeAt(b,0,r),codeAt(b,1,r),codeAt(b,2,r)],ss=codes.map(function(c){return st.seats[c]||null;});
    var occ=ss.filter(function(x){return x;});
    ss.forEach(function(s,pos){
      if(!s||s.k==='a')return;
      var fk=famKey(s),ok;
      if(s.k==='p'){
        ok=[pos-1,pos+1].some(function(q){var o=ss[q];return o&&o.k==='a'&&famKey(o)===fk;});
        if(!ok)w.push({code:codes[pos],msg:s.n+'（未就学）の隣に保護者がいません'});
      }else{
        ok=ss.some(function(o){return o&&o.k==='a'&&famKey(o)===fk;});
        if(!ok)w.push({code:codes[pos],msg:s.n+'（小学生）と同じ机に保護者がいません'});
      }
    });
    if(occ.length===3&&occ.some(function(x){return x.k!=='a';})){
      var k0=famKey(occ[0]);
      if(!occ.every(function(x){return famKey(x)===k0;}))w.push({code:codes[1],msg:codes[0]+'〜'+codes[2]+'の机：子どもを含む3人掛けは同じ家族だけにしてください'});
    }
  }
  return w;
}

/* ---------- reading .xlsx / .csv / pasted cells ---------- */
function u16(b,o){return b[o]|(b[o+1]<<8);}
function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;}
function unzip(b){
  var i=b.length-22;for(;i>=0;i--){if(u32(b,i)===0x06054b50)break;}
  if(i<0)throw new Error('notzip');
  var n=u16(b,i+10),off=u32(b,i+16),files={},td=new TextDecoder();
  for(var k=0;k<n&&off+46<=b.length;k++){
    if(u32(b,off)!==0x02014b50)break;
    var nl=u16(b,off+28),xl=u16(b,off+30),cl=u16(b,off+32);
    files[td.decode(b.subarray(off+46,off+46+nl))]={method:u16(b,off+10),csize:u32(b,off+20),lo:u32(b,off+42)};
    off+=46+nl+xl+cl;
  }
  return {b:b,files:files};
}
function readEntry(z,name){
  var f=z.files[name];if(!f)return Promise.resolve('');
  var b=z.b,start=f.lo+30+u16(b,f.lo+26)+u16(b,f.lo+28),data=b.subarray(start,start+f.csize);
  if(f.method===0)return Promise.resolve(new TextDecoder().decode(data));
  if(f.method!==8||typeof DecompressionStream==='undefined')return Promise.reject(new Error('nodeflate'));
  return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function xmlEls(node,name){return Array.prototype.slice.call(node.getElementsByTagNameNS('*',name));}
function xmlDoc(t){return new DOMParser().parseFromString(t,'application/xml');}
function plainText(node){var out='';xmlEls(node,'t').forEach(function(tn){if(tn.parentNode&&tn.parentNode.localName==='rPh')return;out+=tn.textContent;});return out;}
function sharedStrings(t){return t?xmlEls(xmlDoc(t),'si').map(plainText):[];}
function colIndex(ref){var m=/^([A-Z]+)/.exec(ref||''),n=0;if(!m)return -1;for(var i=0;i<m[1].length;i++)n=n*26+(m[1].charCodeAt(i)-64);return n-1;}
function sheetRows(t,ss){
  var rows=[];
  xmlEls(xmlDoc(t),'row').forEach(function(rw){
    var row=[];
    xmlEls(rw,'c').forEach(function(c,idx){
      var ci=colIndex(c.getAttribute('r'));if(ci<0)ci=idx;
      var ty=c.getAttribute('t'),v='';
      if(ty==='inlineStr')v=plainText(c);
      else{var vn=xmlEls(c,'v')[0];v=vn?vn.textContent:'';if(ty==='s')v=ss[+v]||'';}
      row[ci]=v;
    });
    rows.push(row);
  });
  return rows;
}
function xlsxPeople(bytes){
  var z=unzip(bytes);
  var names=Object.keys(z.files).filter(function(n){return /^xl\/worksheets\/[^\/]+\.xml$/.test(n);});
  names.sort(function(p,q){return (parseInt(p.replace(/\D+/g,''),10)||0)-(parseInt(q.replace(/\D+/g,''),10)||0);});
  if(!names.length)throw new Error('notxlsx');
  return readEntry(z,'xl/sharedStrings.xml').then(function(sst){
    var ss=sharedStrings(sst),i=0;
    function next(){
      if(i>=names.length)throw new Error('noheader');
      return readEntry(z,names[i++]).then(function(t){
        try{var p=rowsToPeople(sheetRows(t,ss));if(p.length)return p;}catch(e){if(e.message!=='noheader')throw e;}
        return next();
      });
    }
    return next();
  });
}
function parseDelimited(text){
  var lines=text.replace(/\r\n?/g,'\n'),d=lines.indexOf('\t')>=0?'\t':',',rows=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<lines.length;i++){
    ch=lines.charAt(i);
    if(q){if(ch==='"'){if(lines.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"'&&cur==='')q=true;
    else if(ch===d){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function bytesPeople(bytes){
  if(bytes.length>3&&bytes[0]===0x50&&bytes[1]===0x4b)return xlsxPeople(bytes);
  if(bytes.length>3&&bytes[0]===0xd0&&bytes[1]===0xcf)return Promise.reject(new Error('oldxls'));
  var text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}
  catch(e){try{text=new TextDecoder('shift_jis').decode(bytes);}catch(e2){text=new TextDecoder().decode(bytes);}}
  return Promise.resolve().then(function(){return rowsToPeople(parseDelimited(text));});
}
function importError(e){
  var m=e&&e.message;
  if(m==='noheader')return '「氏名」という見出しの列が見つかりませんでした。見出しの行ごと読み込んでください。';
  if(m==='oldxls')return '古い形式（.xls）は読めません。.xlsx で保存し直すか、表をコピーして貼り付けてください。';
  if(m==='nodeflate')return 'このブラウザではExcelファイルを開けません。表をコピーして貼り付けてください。';
  return 'ファイルを読み込めませんでした。表をコピーして貼り付ける方法もお試しください。';
}
function importDone(people){
  if(!people.length){toast('名簿に氏名が見つかりませんでした。');return;}
  sheet={kind:'import-ok',plan:planSeats(people),people:people};render();
}

/* ---------- share link (compressed when the browser can) ---------- */
function packState(st){
  var o={t:st.title,s:st.sub,p:{}};
  Object.keys(st.seats).forEach(function(c){var x=st.seats[c];o.p[c]=[x.n,x.a,x.k,x.t,x.f||''];});
  return JSON.stringify(o);
}
function unpackState(json){
  var o=JSON.parse(json);
  if(o&&o.seats)return clean(o);
  if(!o||typeof o.p!=='object'||!o.p)return null;
  var out={title:o.t,sub:o.s,seats:{}};
  Object.keys(o.p).forEach(function(c){var a=o.p[c];if(Array.isArray(a))out.seats[c]={n:a[0],a:a[1],k:a[2],t:a[3],f:a[4]};});
  return clean(out);
}
function b64url(bytes){
  var s='';for(var i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlBytes(h){
  var b=h.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;
}
function pipe(bytes,stream){return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function(b){return new Uint8Array(b);});}
function shareUrl(){
  var base=location.href.split('#')[0],raw=new TextEncoder().encode(packState(state));
  if(typeof CompressionStream==='undefined')return Promise.resolve(base+'#s='+b64url(raw));
  return pipe(raw,new CompressionStream('deflate-raw')).then(function(z){return base+'#z='+b64url(z);},function(){return base+'#s='+b64url(raw);});
}
function boot(){
  var m=/^#([sz])=([A-Za-z0-9_-]+)$/.exec(location.hash||'');
  viewing=false;state=loadDraft()||defaultState();
  if(!m){render();return Promise.resolve();}
  return Promise.resolve().then(function(){
    var bytes=b64urlBytes(m[2]);
    if(m[1]==='s')return bytes;
    if(typeof DecompressionStream==='undefined')throw new Error('nodeflate');
    return pipe(bytes,new DecompressionStream('deflate-raw'));
  }).then(function(bytes){
    var st=unpackState(new TextDecoder().decode(bytes));
    if(!st)throw new Error('bad');
    st.rev=0;state=st;viewing=true;render();
  }).catch(function(e){
    render();
    if(e&&e.message==='nodeflate')toast('このブラウザでは共有リンクを開けません。別のブラウザでお試しください。');
  });
}

/* ---------- drag and drop: swap two seats ---------- */
var drag=null,suppressClick=false;
function seatElAt(x,y){
  var el=document.elementFromPoint(x,y);
  while(el&&el!==document.body){if(el.classList&&el.classList.contains('seat'))return el;el=el.parentNode;}
  return null;
}
function seatElOf(target){
  var el=target;
  while(el&&el!==app){if(el.classList&&el.classList.contains('seat'))return el;el=el.parentNode;}
  return null;
}
function dragArm(el,x,y){
  if(viewing||sheet||!el||!el.classList.contains('on'))return false;
  drag={code:el.getAttribute('data-c'),sx:x,sy:y,x:x,y:y,active:false,over:null,ghost:null,timer:0,tick:0};
  return true;
}
function dragStart(){
  if(!drag||drag.active)return;
  var s=state.seats[drag.code];if(!s){drag=null;return;}
  drag.active=true;
  var g=document.createElement('div');g.className='ghost';g.textContent=s.n;document.body.appendChild(g);drag.ghost=g;
  var src=app.querySelector('.seat[data-c="'+drag.code+'"]');if(src)src.classList.add('dragging');
  document.body.classList.add('drag-on');
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}
  drag.tick=setInterval(dragScroll,30);
  dragMove(drag.x,drag.y);
}
function dragScroll(){
  if(!drag||!drag.active)return;
  var sc=document.getElementById('scroll');if(!sc)return;
  var r=sc.getBoundingClientRect(),x=drag.x,y=drag.y,moved=false;
  if(x<r.left+36){sc.scrollLeft-=14;moved=true;}else if(x>r.right-36){sc.scrollLeft+=14;moved=true;}
  var bar=document.querySelector('.bar'),bottom=bar?bar.getBoundingClientRect().top:window.innerHeight;
  if(y<50){window.scrollBy(0,-14);moved=true;}else if(y>bottom-30){window.scrollBy(0,14);moved=true;}
  if(moved)dragOver();
}
function dragOver(){
  var t=seatElAt(drag.x,drag.y),code=t?t.getAttribute('data-c'):null;
  if(code===drag.over)return;
  var old=app.querySelector('.seat.drop');if(old)old.classList.remove('drop');
  drag.over=code;
  if(t&&code!==drag.code)t.classList.add('drop');
}
function dragMove(x,y){
  drag.x=x;drag.y=y;
  drag.ghost.style.transform='translate('+(x+12)+'px,'+(y-46)+'px)';
  dragOver();
}
function dragEnd(cancel){
  if(!drag)return;
  var d=drag;drag=null;
  clearTimeout(d.timer);clearInterval(d.tick);
  if(!d.active)return;
  if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  document.body.classList.remove('drag-on');
  if(!cancel&&d.over&&d.over!==d.code&&validCode(d.over)){
    var A=state.seats[d.code],B=state.seats[d.over];
    if(B)state.seats[d.code]=B;else delete state.seats[d.code];
    state.seats[d.over]=A;
    touch();
  }
  suppressClick=true;setTimeout(function(){suppressClick=false;},350);
  render();
}
app.addEventListener('mousedown',function(e){
  if(e.button!==0||drag)return;
  dragArm(seatElOf(e.target),e.clientX,e.clientY);
});
window.addEventListener('mousemove',function(e){
  if(!drag||drag.touch)return;
  if(!drag.active){if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<7)return;drag.x=e.clientX;drag.y=e.clientY;dragStart();if(!drag)return;}
  e.preventDefault();dragMove(e.clientX,e.clientY);
});
window.addEventListener('mouseup',function(){if(drag&&!drag.touch)dragEnd(false);});
app.addEventListener('touchstart',function(e){
  if(drag||e.touches.length!==1)return;
  var t=e.touches[0];
  if(!dragArm(seatElOf(e.target),t.clientX,t.clientY))return;
  drag.touch=true;drag.timer=setTimeout(dragStart,380);
},{passive:true});
app.addEventListener('touchmove',function(e){
  if(!drag||!drag.touch)return;
  var t=e.touches[0];
  if(!drag.active){
    if(Math.abs(t.clientX-drag.sx)+Math.abs(t.clientY-drag.sy)>10)dragEnd(true);
    else{drag.x=t.clientX;drag.y=t.clientY;}
    return;
  }
  if(e.cancelable)e.preventDefault();
  dragMove(t.clientX,t.clientY);
},{passive:false});
app.addEventListener('touchend',function(e){
  if(!drag||!drag.touch)return;
  if(drag.active&&e.cancelable)e.preventDefault();
  dragEnd(false);
},{passive:false});
app.addEventListener('touchcancel',function(){if(drag&&drag.touch)dragEnd(true);});
app.addEventListener('contextmenu',function(e){if(seatElOf(e.target))e.preventDefault();});

boot();
window.addEventListener('hashchange',function(){sheet=null;boot();});
window.__sekiji={shareUrl:shareUrl,pdfBytes:pdfBytes,rowsToPeople:rowsToPeople,planSeats:planSeats,validate:validate,sharedStrings:sharedStrings,parseDelimited:parseDelimited,clinicColors:function(){return clinicColors(state);},getState:function(){return state;}};
})();
